defaults:
- ppo_trainer
- _self_
data:
  train_files: /mnt/lv_model/npu60005420a/data/gsm8k_owner_aligned_20260729/verl_test_official_twinkle_aligned.parquet
  val_files: /mnt/lv_model/npu60005420a/data/gsm8k_owner_aligned_20260729/verl_test_official_twinkle_aligned.parquet
  prompt_key: prompt
  reward_fn_key: data_source
  max_prompt_length: 1024
  max_response_length: 1024
  train_max_samples: -1
  train_batch_size: 16
  val_batch_size: 16
  return_raw_chat: true
  apply_chat_template_kwargs:
    enable_thinking: true
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 4
  truncation: error
  shuffle: false
  seed: 1
  output_path: /mnt/lv_model/npu60005420a/qy_owner_experiments_20260730/qy_owner_verl_base_manual_eval_official1319_npu3/generated.parquet
algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  filter_groups:
    enable: false
actor_rollout_ref:
  model:
    path: /mnt/lv_model/npu60005420a/models/Qwen3-4B
    use_remove_padding: false
    enable_gradient_checkpointing: true
    lora_rank: 0
    lora_alpha: 16
    target_modules: all-linear
    lora_adapter_path: null
  actor:
    strategy: fsdp2
    ppo_mini_batch_size: 16
    ppo_epochs: 1
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 4096
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    use_kl_loss: false
    entropy_coeff: 0
    loss_agg_mode: token-mean
    use_torch_compile: false
    data_loader_seed: 1
    optim:
      lr: 1.7e-05
      weight_decay: 0.01
    fsdp_config:
      strategy: fsdp2
      seed: 1
      reshard_after_forward: true
      param_offload: false
      optimizer_offload: false
      use_torch_compile: false
  ref:
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 4096
    use_torch_compile: false
  rollout:
    name: vllm
    mode: async
    nnodes: 1
    n_gpus_per_node: 1
    tensor_model_parallel_size: 1
    data_parallel_size: 1
    'n': 1
    seed: 1
    temperature: 0.6
    top_p: 1.0
    top_k: -1
    gpu_memory_utilization: 0.7
    enforce_eager: false
    max_num_batched_tokens: 4096
    max_model_len: 2048
    max_num_seqs: 64
    enable_chunked_prefill: true
    calculate_log_probs: true
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 4096
    val_kwargs:
      temperature: 0.6
      top_p: 1.0
      top_k: -1
      do_sample: true
      'n': 1
    checkpoint_engine:
      backend: nccl
      update_weights_bucket_megabytes: 1536
    response_length: 1024
reward:
  num_workers: 4
  custom_reward_function:
    path: ${oc.env:GSM8K_REWARD_PATH}
    name: compute_score
  reward_manager:
    name: naive
  reward_model:
    enable: false
trainer:
  use_v1: true
  device: npu
  nnodes: 1
  n_gpus_per_node: 1
  project_name: twinkle-aligned-gsm8k-grpo
  experiment_name: async-single-lora-gsm8k-accuracy
  logger:
  - console
  - tensorboard
  rollout_data_dir: ${oc.env:OUTPUT_DIR}/rollouts
  validation_data_dir: ${oc.env:OUTPUT_DIR}/validation_data
  val_before_train: false
  test_freq: -1
  save_freq: 125
  total_epochs: 1
  total_training_steps: 125
  default_local_dir: ${oc.env:CKPTS_DIR}
  resume_mode: disable
  v1:
    trainer_mode: separate_async
    separate_async:
      num_warmup_batches: 0
      parameter_sync_step: 1
    sampler:
      max_off_policy_threshold: 1
      max_off_policy_strategy: wait
transfer_queue:
  enable: true
  metrics:
    enabled: true
    port: 0
  backend:
    storage_backend: SimpleStorage
    SimpleStorage:
      total_storage_size: 10000
      num_data_storage_units: 2
